version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: coupon-postgres
    environment:
      POSTGRES_DB: coupons
      POSTGRES_USER: coupons
      POSTGRES_PASSWORD: coupons
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - coupon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coupons -d coupons"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
    driver: local

networks:
  coupon-net:
    driver: bridge