spring:
  application:
    name: coupon-service
  datasource:
    url: jdbc:postgresql://localhost:5433/coupons
    username: coupons
    password: coupons
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  shutdown: graceful
  # Behind a reverse proxy / load balancer set to "framework" (or "native") so that the
  # real client IP is taken from X-Forwarded-For. Keep "none" when the service is exposed
  # directly: the header is client-controlled and would allow spoofing the country.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

coupons:
  geolocation:
    base-url: https://ipwho.is
    connect-timeout: 2s
    read-timeout: 3s